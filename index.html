<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!--ARTIFACT-START-->
<title>Głębina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Układ: jedna kolumna jak sonda opadająca w toń; tło ciemnieje z głębokością nurkowania. */
:root {
  color-scheme: dark;
  --bg-top: #1d6f9a;
  --bg-bottom: #0e3f63;
  --ink: #eaf5ff;
  --ink-dim: #a3bfd6;
  --ink-faint: #6f8ea8;
  --krill: #ff8f7e;
  --krill-deep: #e2604f;
  --glow: #86e6ff;
  --panel: rgba(3, 18, 36, 0.58);
  --panel-solid: #08223b;
  --line: rgba(163, 191, 214, 0.2);
  --t1: #8fd3ff;
  --t2: #6fe0b6;
  --t3: #b99cff;
  --t4: #ff8f7e;
  --t5: #ffd36b;
  --bad: #ff6b81;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg-bottom);
  background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  background-attachment: fixed;
  transition: background-color 1.2s ease;
  -webkit-font-smoothing: antialiased;
}
#snieg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.aplikacja {
  position: relative; z-index: 1;
  max-width: 680px; margin: 0 auto; min-height: 100%;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

/* Pasek górny: logo i sonda głębokości */
.gora { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo {
  font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: 0.02em;
  background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 8px;
}
.logo svg { width: 22px; height: 22px; }
.sonda { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sonda .m { font-size: 20px; font-weight: 600; }
.sonda .strefa { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
.skala { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.skala .wypelnienie { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--glow), var(--krill)); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.skala .znacznik { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.25); }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}

/* Menu */
.bohater { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; }
.bohater h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800;
  font-size: clamp(44px, 13vw, 84px); line-height: 0.95; letter-spacing: -0.02em;
  text-wrap: balance;
}
.bohater h1 span { color: var(--krill); }
.bohater p { margin: 0; color: var(--ink-dim); max-width: 46ch; font-size: 17px; }
.tryby { display: grid; gap: 12px; }
.tryb {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 14px;
  text-align: left; padding: 18px 20px; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line);
  transition: border-color .2s, transform .2s;
}
.tryb:hover { border-color: rgba(134,230,255,0.55); transform: translateY(-1px); }
.tryb.glowny { background: linear-gradient(135deg, rgba(255,143,126,0.22), rgba(3,18,36,0.6)); border-color: rgba(255,143,126,0.5); }
.tryb .nazwa { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.tryb .opis { grid-column: 1; color: var(--ink-dim); font-size: 14px; }
.tryb .strzalka { grid-row: 1 / span 2; grid-column: 2; font-family: var(--f-mono); color: var(--glow); font-size: 14px; text-align: right; }
.paczki { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.paczka {
  text-align: left; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.04);
  border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px;
}
.paczka:hover { border-color: rgba(134,230,255,0.55); }
.paczka b { font-weight: 700; }
.paczka small { color: var(--ink-faint); font-family: var(--f-mono); font-size: 12px; }
.statystyki { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-faint); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.etykieta { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
.stopka { color: var(--ink-faint); font-size: 13px; text-align: center; }
.stopka b { font-family: var(--f-mono); color: var(--ink-dim); font-weight: 600; }
.linkowy { background: none; border: 0; color: var(--glow); padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* Runda */
.runda { display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-dim); font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; }
.butle { display: flex; gap: 4px; }
.butla { width: 10px; height: 18px; border-radius: 5px; border: 1.5px solid var(--glow); }
.butla.pelna { background: var(--glow); }
.pytanie {
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(28px, 7.5vw, 46px); line-height: 1.08; margin: 0; text-wrap: balance;
}
.pytanie .lit { color: var(--krill); }
.podpowiedz { margin: 0; color: var(--ink-dim); font-size: 14px; }
.zegar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
.zegar div { height: 100%; width: 100%; background: var(--glow); transform-origin: left; }
.zegar.koniec div { background: var(--krill); }
.sekundy { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 13px; text-align: right; }
form.wpis { display: flex; gap: 8px; }
form.wpis input {
  flex: 1; min-width: 0; font: 600 22px/1.2 var(--f-body); color: var(--ink);
  background: rgba(0,0,0,0.25); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
}
form.wpis input::placeholder { color: var(--ink-faint); font-weight: 500; }
form.wpis input:focus { border-color: var(--glow); outline: none; }
.przycisk {
  border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 700;
  background: var(--krill); color: #2a0b07;
}
.przycisk:hover { background: #ffa596; }
.przycisk.drugi { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid var(--line); }
.przycisk.drugi:hover { background: rgba(255,255,255,0.14); }
.rzad { display: flex; gap: 10px; flex-wrap: wrap; }
.komunikat { min-height: 24px; font-size: 15px; color: var(--ink-dim); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.komunikat.zly { color: var(--bad); }
.komunikat .przycisk { padding: 8px 12px; font-size: 14px; }
.potrzasnij { animation: potrzasnij .35s; }
@keyframes potrzasnij { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.proby { display: flex; flex-wrap: wrap; gap: 6px; }
.proba { font-size: 13px; color: var(--ink-faint); text-decoration: line-through; }

/* Wynik rundy */
.wynik { display: flex; flex-direction: column; gap: 14px; }
.wynik .slowo { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 8vw, 52px); line-height: 1; margin: 0; overflow-wrap: anywhere; }
.wynik .punkty { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wynik .punkty b { font-family: var(--f-mono); font-size: 34px; color: var(--krill); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid currentColor; }
.chip.t0 { color: var(--ink-faint); }
.chip.t1 { color: var(--t1); } .chip.t2 { color: var(--t2); } .chip.t3 { color: var(--t3); } .chip.t4 { color: var(--t4); } .chip.t5 { color: var(--t5); }
.popularnosc { color: var(--ink-dim); font-size: 14px; }
.lista { margin: 0; color: var(--ink-dim); font-size: 14px; }
.lista b { color: var(--ink); font-weight: 600; }

/* Podsumowanie */
.koniec h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 10vw, 60px); margin: 0; line-height: 1; font-variant-numeric: tabular-nums; }
.koniec .strefa-duza { color: var(--glow); font-weight: 700; }
.koniec .stworzenie { color: var(--ink-dim); margin: 4px 0 0; }
.tabela { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabela td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tabela td:first-child { color: var(--ink-faint); width: 44%; padding-right: 12px; }
.tabela td:last-child { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.tabela .w { font-weight: 700; overflow-wrap: anywhere; }
.udostepnij { font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px; margin: 0; user-select: all; }

/* Okno zasad */
.zasady ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-dim); }
.zasady ol b { color: var(--ink); }
.strefy { display: grid; gap: 6px; font-size: 14px; }
.strefy div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
.strefy span:first-child { font-family: var(--f-mono); color: var(--ink-faint); }

@media (max-width: 480px) {
  .statystyki { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  form.wpis { flex-direction: column; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<canvas id="snieg" aria-hidden="true"></canvas>
<div class="aplikacja">
  <header class="gora">
    <button class="logo" id="logo" type="button" aria-label="Wróć do menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13c3-5 9-7 14-5 2 .8 3.3 2.2 4 4-2.6.3-4.3 1.7-5 4-3.2 1.6-7.7 1-13-3z" fill="#ff8f7e"/><circle cx="16.5" cy="10.5" r="1.1" fill="#08223b"/><path d="M5 14l-2 3M8 15.2l-1.4 3.2M11 15.8l-.6 3.2" stroke="#ff8f7e" stroke-width="1.3" stroke-linecap="round"/></svg>
      Głębina
    </button>
    <div class="sonda" aria-live="polite">
      <div class="m" id="sondaM">0 m</div>
      <div class="strefa" id="sondaStrefa">Powierzchnia</div>
    </div>
  </header>
  <div class="skala" id="skala"><div class="wypelnienie" id="skalaWyp"></div></div>
  <main id="ekran"></main>
</div>

<script src="dane/kategorie.js"></script>
<script src="dane/slownik.js"></script>
<script src="gra.js"></script>
<!--ARTIFACT-END-->
</body>
</html>
